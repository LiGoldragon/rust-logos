[package]
name         = "rust-logos"
version      = "0.32.0"
autotests    = false
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/rust-logos"
description  = "The structural Rust TextualForm for Logos"
publish      = false

[lib]
name = "rust_logos"
path = "src/lib.rs"

[[test]]
name = "slice_one"
path = "tests/slice_one.rs"

[[test]]
name = "slice_two"
path = "tests/slice_two.rs"

[[test]]
name = "wire_derives"
path = "tests/wire_derives.rs"

[dependencies]
core-logos             = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "b9bf013f6013" }
name-table             = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43" }
syn                    = { version = "2", features = ["full"] }
thiserror              = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
