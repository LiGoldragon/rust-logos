[package]
name         = "rust-logos"
version      = "0.31.0"
autotests    = false
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/rust-logos"
description  = "The structural Rust TextualForm for Logos"
publish      = false

[lib]
name = "rust_logos"
path = "src/lib.rs"

[[test]]
name = "slice_one"
path = "tests/slice_one.rs"

[[test]]
name = "slice_two"
path = "tests/slice_two.rs"

[dependencies]
core-logos             = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "734363bd5fca01c7dab46028f4a36e3ce6ae6650" }
name-table             = { git = "https://github.com/LiGoldragon/name-table.git", rev = "a22f48d8040ab9235f3552ad8654ff8e27b8157d" }
legacy-name-table      = { package = "name-table", git = "https://github.com/LiGoldragon/name-table.git", rev = "196610e2907687dcb8dbd0d2dfaafe4aefd9fa27" }
raw-discovery          = { git = "https://github.com/LiGoldragon/raw-discovery.git", rev = "2d4e2e00f2821c4e2893fa96028cef0ac76e9644" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "3f41813dd63904c7e2b3da4382eff64ed1bf12fe" }
sema-translator        = { git = "https://github.com/LiGoldragon/sema-translator.git", rev = "4bd6e8fa0c3139be94a83c7ca7975bd8153eb9f5", default-features = false, features = ["bootstrap"] }
structural-codec       = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "879d76f91facedd6d5cbca79e282260e1beb9478" }
bs58                   = "0.5"
prettyplease           = "0.2"
proc-macro2            = "1"
quote                  = "1"
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
syn                    = { version = "2", features = ["full"] }
thiserror              = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
