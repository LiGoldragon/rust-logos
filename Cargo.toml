[package]
name         = "textual-rust"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/textual-rust"
description  = "The TextualRust form codec: the two-way bridge between Rust TEXT and the stringless CoreLogos algebra. Reads a principled Rust subset into Logos through syn; projects Logos out as byte-exact prettyplease Rust. This is the foreign raw layer where syn and prettyplease are allowed; the Core sibling core-logos stays text-free."
publish      = false

[lib]
name = "textual_rust"
path = "src/lib.rs"

[dependencies]
core-logos       = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "5fdb91d58e146db8dee177d9e69abd322583c972" }
name-table       = { git = "https://github.com/LiGoldragon/name-table.git", rev = "a1705ef512efec28925ae3ffc9faa5a2aa4dc4a8" }
content-identity = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "ac0075842799b3ece8909ad0eb4b8a92b596b188" }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "9103ec94579cf7892fac7e20e1ef7beb77153673" }
proc-macro2      = "1"
quote            = "1"
syn              = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
prettyplease     = "0.2"
thiserror        = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
