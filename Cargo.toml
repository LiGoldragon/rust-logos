[package]
name         = "rust-logos"
version      = "0.2.0"
autotests    = false
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/rust-logos"
description  = "The structural Rust TextualForm for Logos"
publish      = false

[lib]
name = "rust_logos"
path = "src/lib.rs"

[[test]]
name = "slice_one"
path = "tests/slice_one.rs"

[dependencies]
core-logos             = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "a7dd1e2b8d0c55d26e96c5b1b7154a534cf03e55" }
name-table             = { git = "https://github.com/LiGoldragon/name-table.git", rev = "1f558eac44bd03034e51ad98e3a65ec16d8b8411" }
raw-discovery          = { git = "https://github.com/LiGoldragon/raw-discovery.git", rev = "d979778aa9d79199785f7b683f1029534aea3604" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "8ff7d0db033c756a0cd7999e72e564ca1c32b4aa" }
structural-codec       = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "e47bec61c81fba80deb44c5920f6a15420bbf962" }
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror              = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
