[package]
name         = "textual-rust"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/textual-rust"
description  = "The TextualRust form codec: the two-way bridge between Rust TEXT and the stringless EncodedLogos algebra. Reads a principled Rust subset into Logos through syn; projects Logos out as byte-exact prettyplease Rust. This is the foreign raw layer where syn and prettyplease are allowed; the Core sibling core-logos stays text-free."
publish      = false

[lib]
name = "textual_rust"
path = "src/lib.rs"

[dependencies]
core-logos       = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "7fabf6d42f458963c6b4bf526284ba88087a71c7" }
name-table       = { git = "https://github.com/LiGoldragon/protos.git", rev = "e9983d6220856a011886145ed0ef0cc41c9bf597" }
content-identity = { git = "https://github.com/LiGoldragon/protos.git", rev = "e9983d6220856a011886145ed0ef0cc41c9bf597" }
proc-macro2      = "1"
quote            = "1"
syn              = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
prettyplease     = "0.2"
thiserror        = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
