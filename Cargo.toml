[package]
name         = "rust-logos"
version      = "0.4.0"
autotests    = false
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/rust-logos"
description  = "The structural Rust TextualForm for Logos"
publish      = false

[lib]
name = "rust_logos"
path = "src/lib.rs"

[[test]]
name = "slice_one"
path = "tests/slice_one.rs"

[dependencies]
core-logos             = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "3e4ae814f684b44c0aa45d5887c09a7d61d75db6" }
name-table             = { git = "https://github.com/LiGoldragon/name-table.git", rev = "50cb4bb53ae2dc4f2516f6912be328ef98ae49f8" }
raw-discovery          = { git = "https://github.com/LiGoldragon/raw-discovery.git", rev = "7290f65bbb5e7825ab2ca58340631d154d69d110" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "8c504ba7aa8dbdc5edf7daadbb862bbdaa5613be" }
structural-codec       = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "5c11e1fb7f58444cd860207803d8f705e7415d71" }
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror              = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
