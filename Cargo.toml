[package]
name         = "textual-rust"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/textual-rust"
description  = "The TextualRust form codec: the two-way bridge between Rust TEXT and the stringless CoreLogos algebra. Reads a principled Rust subset into Logos through syn; projects Logos out as byte-exact prettyplease Rust. This is the foreign raw layer where syn and prettyplease are allowed; the Core sibling core-logos stays text-free."
publish      = false

[lib]
name = "textual_rust"
path = "src/lib.rs"

[dependencies]
core-logos       = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "749408b13f5af64284dd9c596271232a89cc758b" }
name-table       = { git = "https://github.com/LiGoldragon/name-table.git", rev = "196610e2907687dcb8dbd0d2dfaafe4aefd9fa27" }
content-identity = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "24b43bae5d9748b0e7f679c6ec9f85a643c4d36a" }
proc-macro2      = "1"
quote            = "1"
syn              = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }
prettyplease     = "0.2"
thiserror        = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
